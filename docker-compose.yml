services:
  stock-mover:
    build: .
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      APPROVAL_TOKEN: ${APPROVAL_TOKEN:-}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-}
      AUTO_RUN_INTERVAL_HOURS: ${AUTO_RUN_INTERVAL_HOURS:-24}
      AGE_THRESHOLD_DAYS: ${AGE_THRESHOLD_DAYS:-120}
      DATA_DIR: /app/data
      FASTAPI_URL: http://127.0.0.1:8000
    volumes:
      - stock-mover-data:/app/data
    restart: unless-stopped

volumes:
  stock-mover-data:
